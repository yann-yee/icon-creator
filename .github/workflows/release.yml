name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: svg2icon-linux
            ext: ''
            deps: musl-tools

          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: svg2icon-mac
            ext: ''

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: svg2icon-win.exe
            ext: '.exe'

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: svg2icon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (Linux musl)
        if: matrix.deps
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/svg2icon${{ matrix.ext }}"
          cp "$SRC" "${{ matrix.binary_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: svg2icon/${{ matrix.binary_name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            find "$dir" -type f -exec cp {} "release-files/$name" \;
          done
          ls -la release-files/

      - name: Generate release notes
        run: |
          cat > release-notes.md << 'EOF'
          ## 🚀 svg2icon ${{ github.ref_name }}

          ### 下载

          | 平台 | 文件 |
          |------|------|
          | 🐧 Linux   | \`svg2icon-linux\`  (静态链接，兼容所有发行版) |
          | 🍎 macOS   | \`svg2icon-mac\` |
          | 🪟 Windows | \`svg2icon-win.exe\` |

          ### 使用方式

          ```bash
          # Linux / macOS
          chmod +x svg2icon-linux
          ./svg2icon-linux --svg logo.svg -f ico

          # Windows
          svg2icon-win.exe --svg logo.svg -f ico
          ```

          ### 支持的格式

          - `-f png` — 多尺寸 PNG
          - `-f ico` — Windows 图标（多尺寸打包）
          - `-f icns` — macOS 应用图标
          - `-f jpg` — JPEG（白色背景）
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: release-notes.md
          generate_release_notes: false
